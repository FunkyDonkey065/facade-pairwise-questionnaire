[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/local.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/local-entry.js"
  [headers.values]
    Cache-Control = "no-cache"
